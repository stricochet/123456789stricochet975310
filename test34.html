<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stricochet - Arrière-plan personnalisé</title>
    <style>
        /* VARIABLES */
        :root {
            --bg-overlay: rgba(5, 5, 10, 0.85);
            --text-color: #ffffff;
        }

        /* BASE */
        body {
            margin: 0;
            font-family: 'Arial', sans-serif;
            color: var(--text-color);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* ARRIÈRE-PLAN ANIMÉ (Votre image) */
        .background-container {
            position: fixed;
            width: 100vw;
            height: 300vh;
            background: 
                repeating-linear-gradient(
                    0deg,
                    #000000,
                    #000000 20px,
                    #ffffff 20px,
                    #ffffff 40px
                ),
                url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABQAAAAUCAYAAACNiR0NAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAADsMAAA7DAcdvqGQAAABnSURBVDhP7cxBCsAgDETR6P3P3FYr1qKC0w8C+WFmYJiZmVn1xX3fX2ZJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiRJkiT9uwf5ABq1SZIbXwAAAABJRU5ErkJggg==') center/cover;
            background-blend-mode: overlay;
            z-index: -2;
            animation: scrollBackground 30s linear infinite;
        }

        @keyframes scrollBackground {
            0% { transform: translateY(0); }
            100% { transform: translateY(-66.6%); }
        }

        /* OVERLAY NOIR TRANSPARENT */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: var(--bg-overlay);
            z-index: -1;
        }

        /* CONTENU PRINCIPAL */
        .content {
            position: relative;
            padding: 20vh 5% 10rem;
            text-align: center;
        }

        h1 {
            font-size: 3rem;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.8);
        }

        /* CUBES DE FILMS */
        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 1.5rem;
            padding: 3rem 0;
        }

        .movie-cube {
            aspect-ratio: 2/3;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: transform 0.3s;
        }

        .movie-cube:hover {
            transform: scale(1.1);
            background: rgba(255, 255, 255, 0.2);
        }
    </style>
</head>
<body>
    <!-- ARRIÈRE-PLAN PERSONNALISÉ -->
    <div class="background-container"></div>
    <div class="overlay"></div>

    <!-- CONTENU -->
    <div class="content">
        <h1>STRICOCHET</h1>
        
        <div class="movie-grid">
            <!-- 12 cubes de films -->
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
            <div class="movie-cube"></div>
        </div>
    </div>

    <script>
        // Animation aléatoire des cubes au chargement
        document.querySelectorAll('.movie-cube').forEach(cube => {
            cube.style.transform = `rotate(${Math.random() * 10 - 5}deg)`;
        });
    </script>
</body>
</html>
